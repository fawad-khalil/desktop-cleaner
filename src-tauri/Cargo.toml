[package]
name = "desktop-cleaner"
version = "0.1.0"
description = "Cross-platform disk usage analyzer and cleaner"
authors = ["Fawad Khalil"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "desktop_cleaner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.39.6"
dirs = "7.0.0"
trash = "5.2.9"
rayon = "1.12.0"
anyhow = "1.0.104"
tauri-plugin-dialog = "2.8.3"
netstat2 = "0.11.2"
rmp-serde = "1.3.1"
flate2 = "1.1.10"
notify = "8.2.0"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target."cfg(windows)".dependencies]
winreg = "0.56.0"

[target.'cfg(target_os = "macos")'.dependencies]
fsevent-sys = "4.1.0"
