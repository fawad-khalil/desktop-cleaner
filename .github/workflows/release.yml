name: Release

# Builds installers for macOS, Windows and Linux and attaches them to a
# draft GitHub Release. Push a tag like v0.1.0 (matching the version in
# package.json, src-tauri/Cargo.toml and src-tauri/tauri.conf.json), or run
# it by hand from the Actions tab. Review the draft, then publish it.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (universal)
            os: macos-latest
            args: --target universal-apple-darwin
          - name: Windows
            os: windows-latest
            args: --bundles msi,nsis
          - name: Linux
            os: ubuntu-22.04
            args: --bundles deb,appimage,rpm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev rpm

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          # Both Mac architectures, for the universal build.
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # --- Optional code signing (see README "Releases") ---------------
          # Without these, macOS shows a Gatekeeper warning and Windows a
          # SmartScreen warning on first launch. Add the secrets in the repo
          # settings and uncomment.
          #
          # macOS signing + notarization:
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          #
          # Windows: Tauri signs with a certificate configured in
          # tauri.conf.json (bundle.windows.certificateThumbprint or
          # bundle.windows.signCommand); import it in an earlier step.
        with:
          # tauri-action fills in the app version from tauri.conf.json.
          tagName: v__VERSION__
          releaseName: DesktopCleaner v__VERSION__
          releaseBody: |
            Downloads for macOS (universal .dmg / .app), Windows (.msi / .exe installer) and Linux (.deb / .rpm / .AppImage).

            These builds are not code-signed yet: macOS may say the app "can't be opened" (right-click > Open, or allow it in System Settings > Privacy & Security), and Windows SmartScreen may ask you to confirm ("More info" > "Run anyway").
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
