name: CI

# One pipeline:
# - every push to main, pull request and manual run: type-check, build and
#   test on macOS, Windows and Linux;
# - pull requests (and manual runs that don't release): also build the
#   installers and upload them as workflow artifacts to try before merging;
# - pushes to main where all tests pass: work out the next version from the
#   commit messages since the last v* tag (conventional commits: "feat:" ->
#   minor, "type!:" or "BREAKING CHANGE" -> major, which stays a minor bump
#   while the major is 0; anything else -> patch), stamp it into the app for
#   this build only, build the installers and publish GitHub Release vX.Y.Z
#   with generated notes, which creates the tag. Tags are the source of
#   truth for versions; the bump is never committed back (main is protected).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Runs on main (and so releases) never overlap; superseded PR runs are cancelled.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Type-check frontend
        run: npm run check

      - name: Build frontend
        run: npm run build

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

  plan:
    name: Plan release
    needs: test
    runs-on: ubuntu-latest
    outputs:
      # release: publish vX.Y.Z | artifacts: installers as workflow artifacts | none
      mode: ${{ steps.plan.outputs.mode }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags and history, to find the last release

      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          # Highest version tag reachable from this commit.
          last=$(git tag --merged HEAD --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)
          if [ -n "$last" ]; then
            base="${last#v}"
            count=$(git rev-list --count "$last..HEAD")
            log=$(git log --format='%s%n%b' "$last..HEAD")
          else
            # First release: use the version in the repo as is.
            base=$(node -p "require('./src-tauri/tauri.conf.json').version")
            count=$(git rev-list --count HEAD)
            log=""
          fi
          IFS=. read -r major minor patch <<< "$base"
          if [ -z "$last" ]; then
            next="$base"; why="first release"
          elif printf '%s\n' "$log" | grep -qE '^[A-Za-z]+(\([^)]*\))?!:|BREAKING[ -]CHANGE'; then
            if [ "$major" = 0 ]; then next="0.$((minor + 1)).0"; why="breaking change (minor while 0.x)"
            else next="$((major + 1)).0.0"; why="breaking change"; fi
          elif printf '%s\n' "$log" | grep -qE '^feat(\([^)]*\))?:'; then
            next="$major.$((minor + 1)).0"; why="new feature"
          else
            next="$major.$minor.$((patch + 1))"; why="fixes and other changes"
          fi

          if [ "$count" = 0 ]; then
            mode=none
          elif [ "$EVENT" = "pull_request" ]; then
            mode=artifacts
          elif [ "$REF" = "refs/heads/main" ]; then
            mode=release
          else
            mode=artifacts
          fi
          {
            echo "mode=$mode"
            echo "version=$next"
            echo "tag=v$next"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Version"
            echo ""
            echo "| Last release | Commits since | Next version | Why |"
            echo "|---|---|---|---|"
            echo "| ${last:-none} | $count | **v$next** | $why |"
            echo ""
            case "$mode" in
              release) echo "Releasing **v$next** from this commit." ;;
              artifacts) echo "Merging this would release **v$next**. Installers for it are attached to this run as artifacts." ;;
              none) echo "No commits since $last, so nothing to release." ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Mode: $mode, next v$next ($why), $count commit(s) since ${last:-the start}"

  create-release:
    name: Create release
    needs: plan
    if: needs.plan.outputs.mode == 'release'
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.create.outputs.result }}
    steps:
      # A draft until every installer is attached; the publish job releases it.
      - id: create
        uses: actions/github-script@v7
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        with:
          script: |
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: process.env.TAG,
              target_commitish: context.sha,
              name: `DesktopCleaner ${process.env.TAG}`,
              draft: true,
              generate_release_notes: true,
            });
            return data.id;

  package:
    name: Package (${{ matrix.name }})
    needs: [plan, create-release]
    if: >-
      always() && needs.plan.result == 'success' &&
      (needs.plan.outputs.mode == 'artifacts' ||
       (needs.plan.outputs.mode == 'release' && needs.create-release.result == 'success'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (universal)
            os: macos-latest
            args: --target universal-apple-darwin
          - name: Windows
            os: windows-latest
            args: --bundles msi,nsis
          - name: Linux
            os: ubuntu-22.04
            args: --bundles deb,appimage,rpm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev rpm

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          # Both Mac architectures, for the universal build.
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      # Only in this workspace; the repo keeps the last released version.
      - name: Stamp version ${{ needs.plan.outputs.version }}
        shell: bash
        env:
          V: ${{ needs.plan.outputs.version }}
        run: |
          node -e '
            const fs = require("fs"), v = process.env.V;
            for (const f of ["src-tauri/tauri.conf.json", "package.json"]) {
              const j = JSON.parse(fs.readFileSync(f, "utf8"));
              j.version = v;
              fs.writeFileSync(f, JSON.stringify(j, null, 2) + "\n");
            }
            const c = "src-tauri/Cargo.toml";
            fs.writeFileSync(c, fs.readFileSync(c, "utf8").replace(/^version = ".*"$/m, `version = "${v}"`));
          '

      - name: Build and attach to the release
        if: needs.plan.outputs.mode == 'release'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # --- Optional code signing (see README "Releases") ---------------
          # Without these, macOS shows a Gatekeeper warning and Windows a
          # SmartScreen warning on first launch. Add the secrets in the repo
          # settings and uncomment.
          #
          # macOS signing + notarization:
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          #
          # Windows: Tauri signs with a certificate configured in
          # tauri.conf.json (bundle.windows.certificateThumbprint or
          # bundle.windows.signCommand); import it in an earlier step.
        with:
          releaseId: ${{ needs.create-release.outputs.id }}
          args: ${{ matrix.args }}

      - name: Build installers
        if: needs.plan.outputs.mode == 'artifacts'
        run: npm run tauri build -- ${{ matrix.args }}

      - name: Upload installers
        if: needs.plan.outputs.mode == 'artifacts'
        uses: actions/upload-artifact@v4
        with:
          name: DesktopCleaner-${{ needs.plan.outputs.version }}-${{ runner.os }}
          if-no-files-found: error
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/deb/*.deb
            src-tauri/target/**/release/bundle/rpm/*.rpm
            src-tauri/target/**/release/bundle/appimage/*.AppImage

  publish:
    name: Publish release
    needs: [plan, create-release, package]
    if: needs.plan.outputs.mode == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Publish (creates the tag on this commit)
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.id }}
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: Number(process.env.RELEASE_ID),
              draft: false,
            });
